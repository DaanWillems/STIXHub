buckets:
  - name: raw-intel
    mode: append
  - name: Example collection 2
    mode: append

collections:
  - id: 70a16fcf-8146-2da8-be66-6ca6fb7280af
    title: Raw Intel Feed
    description: Raw threat intelligence objects
    can_read: true
    can_write: false
    bucket_name: raw-intel

  - id: 9b3f1a2e-4c7d-4e8f-b123-5a6b7c8d9e0f
    title: Intel Ingest
    description: Write-only collection for collectors
    can_read: false
    can_write: true
    bucket_name: raw-intel

# Collectors periodically pull from a remote TAXII 2.1 collection into a bucket.
# remote_url is the TAXII API root. Credentials are never stored here: with
# credentials_env: "MITRE_TAXII" the collector reads
# STIX_HUB_COLLECTOR_CREDENTIALS__MITRE_TAXII__USER and ..._PASS from the
# environment (or .env). Omit credentials_env for open feeds.
collectors:
 - name: mitre-attack
   remote_url: https://attack-taxii.mitre.org/api/v21/
   remote_collection_id: x-mitre-collection--1f5f1533-f617-4ca8-9ab4-6a02367fa019
   target_bucket: raw-intel
   poll_interval: 300     # seconds, default 300
   max_retries: 3         # default 3
   shutdown_timeout: 30   # seconds, default 30

roles:
  - name: analyst
    can_read:
      - raw-intel
    can_write: []
  - name: collector
    can_read: []
    can_write:
      - raw-intel
  - name: admin
    can_read:
      - raw-intel
    can_write:
      - raw-intel
