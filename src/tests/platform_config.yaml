buckets:
  - name: Example collection
    mode: append

collections:
  - id: 70a16fcf-8146-2da8-be66-6ca6fb7280af
    title: Example collection
    description: Raw threat intelligence objects
    can_read: true
    can_write: false
    bucket_name: raw-intel

roles:
  - name: analyst
    can_read:
      - Example collection
    can_write: []
  - name: reader
    can_read: []
    can_write:
      - Example collection
  - name: admin
    can_read:
      - Example collection
    can_write:
      - Example collection

pipelines:
  - name: a
    role: admin
    sources:
      - "Example collection"
    sinks:
      - "Example collection"
    steps:
     - action: "add"
       field: "labels"
       value: "test"
       condition:
         type: "and"
         condition: []
     - action: "add"
       field: "labels"
       value: "test"
       condition:
         field: "a"
         type: "eq"
         value: "bb"
