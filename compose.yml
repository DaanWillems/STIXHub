services:
  platform:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      STIX_HUB_DATABASE_HOST: postgres
      STIX_HUB_DATABASE_PORT: 5432
      STIX_HUB_DATABASE_NAME: app
      STIX_HUB_DATABASE_USER: postgres
      STIX_HUB_DATABASE_PASS: postgres
      STIX_HUB_DATABASE_ENGINE_ECHO: "false"
      STIX_HUB_PLATFORM_CONFIG: /config/platform_config.yaml
      STIX_HUB_ADMIN_API_KEY: "changeme"
    volumes:
      - ./app/platform_config.yaml:/config/platform_config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
